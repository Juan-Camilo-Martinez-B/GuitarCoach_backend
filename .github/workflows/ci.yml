name: ci

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar el paquete y las herramientas
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Formato
        run: ruff format --check app tests
      - name: Tipos
        run: mypy
      - name: Pruebas
        run: pytest
